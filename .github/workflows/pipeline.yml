# Publishes the pipeline's static reports — dbt docs and Great Expectations
# Data Docs — to GitHub Pages.
#
# THIS WORKFLOW NO LONGER HOLDS THE SCHEDULER ROLE. §8 gave it one, because at
# the time nothing else was always on. The dagster-daemon on `dagster-vm` now
# is, `daily_refresh` ticks at 08:00 SGT there (orchestration/schedules.py),
# and its run history is durable in a way an ephemeral runner's never was.
#
# The cron here was 00:00 UTC — the same instant. Leaving both in place meant
# two schedulers materialising `AssetSelection.all()` simultaneously, racing on
# replace-loads into the same nine BigQuery tables. So the cron is gone, and so
# is the push trigger: a full run costs a 126 MB Kaggle download, nine GCS
# writes and nine table loads, which is not something every commit to main
# should spend.
#
# What is left is on demand. The reports are still the durable, citable
# evidence §8 describes, and they are still generated by a real run — the
# runner is destroyed afterwards, so this leaves no Dagster history behind.
# That is fine now: the VM keeps the history, this keeps the reports.
#
# THE GAP, STATED RATHER THAN DISCOVERED: nothing publishes reports after the
# VM's nightly run. Dispatch this workflow when you want current Data Docs — or
# add a step to the VM's deploy that pulls the artifacts off it.

name: pipeline

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      GCP_LOCATION: US
      GCP_RAW_BUCKET: ${{ secrets.GCP_RAW_BUCKET }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      DBT_PROFILES_DIR: ./transform
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-sa.json
      # Set so the run reads orchestration/dagster.yaml (telemetry off) and
      # writes SQLite history the later steps can read within the job. It dies
      # with the runner — see the header.
      DAGSTER_HOME: ${{ github.workspace }}/orchestration

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Written to disk for dbt and dlt, then removed in the final step. Never
      # committed, never echoed (§10).
      - name: Write service-account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Install dbt packages
        run: uv run dbt deps --project-dir transform

      - name: Materialise the asset graph
        run: uv run python orchestration/run_all.py

      # --- Publish the static reports (§8) ------------------------------------
      # `if: always()` throughout — these artifacts matter most when the run
      # failed (§8, §12).

      - name: Generate dbt docs
        if: always()
        run: uv run dbt docs generate --project-dir transform --target ci

      - name: Collect reports
        if: always()
        run: |
          mkdir -p site/dbt site/quality
          cp -r transform/target/* site/dbt/ 2>/dev/null || true
          cp -r quality/great_expectations/uncommitted/data_docs/local_site/* \
                site/quality/ 2>/dev/null || true

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: site/
          retention-days: 30

      - name: Upload to Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Remove service-account key
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

  publish:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
