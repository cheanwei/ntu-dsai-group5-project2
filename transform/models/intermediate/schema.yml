version: 2

models:
  - name: int_geolocation_deduped
    description: One median latitude/longitude pair per valid Brazilian zip prefix.
    columns:
      - name: geolocation_zip_code_prefix
        description: Zip prefix used to enrich customer and seller dimensions.
        data_tests: [unique, not_null]

  - name: int_order_lifecycle
    description: Order-grain lifecycle timestamps, duration metrics, late flag, and revenue status.
    data_tests:
      # Known source anomalies should remain visible without blocking the build.
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: order_approved_at
            column_B: order_purchase_timestamp
            or_equal: true
            row_condition: "order_approved_at is not null and order_purchase_timestamp is not null"
          config:
            severity: warn
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: order_delivered_carrier_date
            column_B: order_approved_at
            or_equal: true
            row_condition: "order_delivered_carrier_date is not null and order_approved_at is not null"
          config:
            severity: warn
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: order_delivered_customer_date
            column_B: order_delivered_carrier_date
            or_equal: true
            row_condition: "order_delivered_customer_date is not null and order_delivered_carrier_date is not null"
          config:
            severity: warn
    columns:
      - name: order_id
        description: Source order identifier at the model's grain.
        data_tests: [unique, not_null]
      - name: is_late
        description: True when delivery missed the estimate; null for undelivered orders.

  - name: int_order_payment_totals
    description: Item and payment totals aggregated independently and reconciled at order grain.
    columns:
      - name: order_id
        description: Source order identifier at the model's grain.
        data_tests: [unique, not_null]

  - name: int_customer_order_history
    description: Order history and lifetime metrics grouped by stable customer identity.
    columns:
      - name: customer_unique_id
        description: Stable source customer identifier used as the model key.
        data_tests: [unique, not_null]
