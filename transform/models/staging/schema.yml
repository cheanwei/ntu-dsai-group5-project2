version: 2

# Tier 1 tests (§7): unique + not_null on every primary key, accepted_values on
# the enumerated columns. Cheap, structural, and they fail the build.
# `description:` on every model and column is lane C1's deliverable — it renders
# into the searchable catalog produced by `dbt docs generate`.

models:
  - name: stg_customers
    description: TODO(C1)
    columns:
      - name: customer_id
        description: Per-order surrogate. Not the customer key — see stg_customers docs.
        data_tests: [unique, not_null]
      - name: customer_unique_id
        description: TODO(C1)
        data_tests: [not_null]

  - name: stg_orders
    description: TODO(C1)
    columns:
      - name: order_id
        description: TODO(C1)
        data_tests: [unique, not_null]
      - name: customer_id
        description: TODO(C1)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        description: TODO(C1)
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced,
                         processing, created, approved]

  - name: stg_order_items
    description: TODO(C1)
    columns:
      - name: order_id
        description: TODO(C1)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: price
        description: TODO(C1)
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: freight_value
        description: TODO(C1)
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, order_item_id]

  - name: stg_order_payments
    description: TODO(C1)
    columns:
      - name: payment_type
        description: TODO(C1)
        data_tests:
          - accepted_values:
              arguments:
                values: [credit_card, boleto, voucher, debit_card, not_defined]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, payment_sequential]

  - name: stg_order_reviews
    description: >
      TODO(C1). Deduplicated on review_id — the `unique` test below is the
      assertion that the staging dedupe worked.
    columns:
      - name: review_id
        description: TODO(C1)
        data_tests: [unique, not_null]
      - name: review_score
        description: TODO(C1)
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 1 and 5"

  - name: stg_products
    description: TODO(C1)
    columns:
      - name: product_id
        description: TODO(C1)
        data_tests: [unique, not_null]

  - name: stg_sellers
    description: TODO(C1)
    columns:
      - name: seller_id
        description: TODO(C1)
        data_tests: [unique, not_null]

  - name: stg_geolocation
    description: TODO(C1)
    columns:
      - name: geolocation_zip_code_prefix
        description: TODO(C1)
        data_tests: [not_null]

  - name: stg_product_category_translation
    description: TODO(C1)
    columns:
      - name: product_category_name
        description: TODO(C1)
        data_tests: [unique, not_null]
