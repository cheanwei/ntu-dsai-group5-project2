version: 2

models:
  - name: stg_customers
    description: Customer records with source names preserved and zip prefixes kept as strings.
    columns:
      - name: customer_id
        description: Order-level customer record identifier; not a stable customer key.
        data_tests: [unique, not_null]
      - name: customer_unique_id
        description: Stable identifier used to group orders from the same customer.
        data_tests: [not_null]

  - name: stg_orders
    description: One row per order with normalized lifecycle timestamps and status.
    columns:
      - name: order_id
        description: Source order identifier.
        data_tests: [unique, not_null]
      - name: customer_id
        description: Order-level customer record linked to `stg_customers`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        description: Current status recorded for the order.
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced,
                         processing, created, approved]

  - name: stg_order_items
    description: Order lines with product, seller, price, freight, and shipping deadline.
    columns:
      - name: order_id
        description: Parent order identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: price
        description: Item price before freight.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: freight_value
        description: Freight charged for the order line.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, order_item_id]

  - name: stg_order_payments
    description: Payment sequences recorded for each order.
    columns:
      - name: payment_type
        description: Payment method used for the sequence.
        data_tests:
          - accepted_values:
              arguments:
                values: [credit_card, boleto, voucher, debit_card, not_defined]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, payment_sequential]

  - name: stg_order_reviews
    description: Reviews deduplicated by `review_id`, keeping the latest answer timestamp.
    columns:
      - name: review_id
        description: Review identifier after staging deduplication.
        data_tests: [unique, not_null]
      - name: review_score
        description: Customer score from 1 to 5.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 1 and 5"

  - name: stg_products
    description: Product attributes with misspelled source columns renamed.
    columns:
      - name: product_id
        description: Source product identifier.
        data_tests: [unique, not_null]

  - name: stg_sellers
    description: One row per seller with its source city, state, and zip prefix.
    columns:
      - name: seller_id
        description: Source seller identifier.
        data_tests: [unique, not_null]

  - name: stg_geolocation
    description: Source coordinates at zip-prefix grain; duplicates remain for later reduction.
    columns:
      - name: geolocation_zip_code_prefix
        description: Leading-zero-bearing Brazilian zip prefix stored as a string.
        data_tests: [not_null]

  - name: stg_product_category_translation
    description: Portuguese-to-English product category mapping.
    columns:
      - name: product_category_name
        description: Portuguese category name used by the products source.
        data_tests: [unique, not_null]
